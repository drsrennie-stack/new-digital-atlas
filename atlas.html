<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Anatomy Atlas</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: search first (the atlas's main job), results as photo tiles grouped by structure, chapters below. Single light look: white, navy, maroon terra cotta, small gold accents. */
:root{
  --bg:#ffffff; --ink:#0B1530; --muted:#4F576A; --line:rgba(11,21,48,.15);
  --navy:#0B1530; --maroon:#8B3A2E; --maroon-soft:#F3F4F7; --gold:#8B3A2E; --gold-soft:#F3F4F7;
  --shadow:0 0 0 .5px rgba(11,21,48,.15);
  --f-display:"Open Sans","Plus Jakarta Sans",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;font-style:normal}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.45;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:28px 56px;display:grid;gap:30px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--gold)}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,5vw,52px);line-height:1;margin:6px 0 8px;color:var(--navy)}
h2{font-family:var(--f-display);font-weight:600;font-size:24px;margin:0;color:var(--navy)}
.lede{margin:0;color:var(--muted);font-size:18px}
.search{display:grid;gap:10px;max-width:720px}
.search label{font-weight:700;color:var(--maroon)}
.search input{font:inherit;font-size:20px;padding:14px 16px;border:2px solid var(--navy);border-radius:8px;width:100%;color:var(--ink);background:#fff}
.search input:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tries{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:15px;color:var(--muted)}
.tries button{font:inherit;font-size:15px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;cursor:pointer;color:var(--navy)}
.tries button:hover{border-color:var(--maroon);color:var(--maroon)}
#results{display:grid;gap:26px}
.count{font-weight:700;color:var(--maroon)}
.group h3{font-family:var(--f-display);font-weight:600;font-size:21px;margin:0 0 10px;color:var(--navy);display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.group h3 span{font-family:var(--f-body);font-size:14px;font-weight:700;color:var(--gold)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tile{display:grid;gap:8px;text-decoration:none;color:inherit;background:#fff;border-radius:8px;box-shadow:var(--shadow);padding:10px}
.tile:hover .cap b{color:var(--maroon)}
.pic{position:relative;aspect-ratio:4/3;max-width:100%;overflow:hidden;border-radius:8px;background:#fff}
.pic img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.mark{animation:pulse 1.4s ease-out infinite;position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:var(--maroon);color:#fff;font-weight:700;font-size:13px;display:grid;place-items:center;box-shadow:0 0 0 3px #fff,0 0 0 5px #DCB45C}
.cap{font-size:14px;line-height:1.3;color:var(--muted)}
.cap b{display:block;color:var(--navy);font-size:15px}
.none{color:var(--muted)}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.chap{background:#fff;border-radius:8px;box-shadow:var(--shadow);padding:14px;display:grid;gap:10px;align-content:start}
.chap .pic{aspect-ratio:16/10}
.chap .meta{font-size:15px;color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-block;text-decoration:none;font-weight:700;font-size:15px;border-radius:4px;padding:8px 14px;border:1px solid var(--line);color:var(--navy);background:#fff}
.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}
.soon{display:grid;place-items:center;aspect-ratio:16/10;border-radius:8px;background:var(--gold-soft);color:var(--gold);font-weight:700}
@keyframes pulse{0%{box-shadow:0 0 0 3px #fff,0 0 0 5px #DCB45C}100%{box-shadow:0 0 0 3px #fff,0 0 0 14px rgba(220,180,92,0)}}
@media (prefers-reduced-motion:reduce){.mark{animation:none}}
footer{font-size:14px;color:var(--muted)}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <a href="welcome.html" style="text-decoration:none;font-weight:700;font-size:13px;color:var(--maroon)">&larr; Welcome</a>
    <div class="eyebrow">MedMasters Collaborative &middot; Dr. Sharilyn Rennie</div>
    <h1>Anatomy Atlas</h1>
    <p class="lede">Real specimens and models. Practice online or on laminated cards.</p>
  </header>

  <section class="search" aria-label="Find a structure">
    <label for="q">Find a structure</label>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Type a structure, like aorta or papillary muscle">
    <div class="tries" id="tries">Try:</div>
  </section>

  <section id="results" aria-live="polite"></section>

  <section style="display:grid;gap:14px">
    <h2>Chapters</h2>
    <div class="chapters" id="chapters"></div>
  </section>

  <footer>Tap any picture to open that card with the structure marked. Cadaver images courtesy of BlueLink, University of Michigan Medical School.</footer>
</div>

const ABBR={a:'artery',aa:'arteries',art:'artery',v:'vein',vv:'veins',r:'right',rt:'right',l:'left',lt:'left',
 svc:'superior vena cava',ivc:'inferior vena cava',m:'muscle',ant:'anterior',post:'posterior',sr:'sarcoplasmic reticulum'};
const DROP=new Set(['the','of','for','to','opening','openings','space','an']);
function norm(s){return s.toLowerCase().replace(/[\/,.;:()"'+-]/g,' ').split(/\s+/).filter(Boolean)
  .map(w=>ABBR[w]||w).join(' ').split(' ').filter(w=>!DROP.has(w)).map(w=>w.length>4?w.replace(/(es|s)$/,''):w).join(' ')}
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=[...Array(n+1).keys()];
 for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));p=c}return p[n]}
ENTRIES.forEach(e=>{e.nn=e.names.map(norm);e.key=norm(e.show)});
function score(e,q){const qt=q.split(' ');let best=0;
  e.nn.forEach(n=>{let s=0;
    if(n===q)s=100;else if(n.startsWith(q))s=90;else if(n.includes(q))s=75;
    else if(q.length>=5&&lev(q,n)<=Math.max(1,Math.floor(n.length/7)))s=85;
    else{const nt=n.split(' ');if(qt.every(t=>nt.some(w=>w.startsWith(t)||(t.length>=5&&lev(t,w)<=1))))s=60}
    best=Math.max(best,s)});return best}
function tile(e){const a=document.createElement('a');a.className='tile';
  a.href=`${e.d}.html#c${e.c}${e.p?'-p'+e.p:''}`;
  const pic=document.createElement('div');pic.className='pic';
  const img=document.createElement('img');img.src=e.img;img.alt=`${e.show} on ${e.ct}`;img.loading='lazy';pic.appendChild(img);
  if(e.p){const box=4/3,ir=e.w/e.h;let sx,sy,ox=0,oy=0;
    if(ir>box){sx=100/e.w;sy=sx*box;oy=(100-e.h*sy)/2}else{sy=100/e.h;sx=sy/box;ox=(100-e.w*sx)/2}
    const m=document.createElement('span');m.className='mark';m.textContent=e.lab;
    m.style.left=(ox+e.x*sx)+'%';m.style.top=(oy+e.y*sy)+'%';pic.appendChild(m)}
  a.appendChild(pic);
  const cap=document.createElement('div');cap.className='cap';cap.innerHTML=`<b></b>`;cap.firstChild.textContent=`${e.dt} · Card ${e.c}`;
  cap.appendChild(document.createTextNode(e.ct));a.appendChild(cap);return a}
function run(){const raw=document.getElementById('q').value.trim(),out=document.getElementById('results');out.innerHTML='';
  if(norm(raw).length<2)return;const q=norm(raw);
  const hits=ENTRIES.map(e=>({e,s:score(e,q)})).filter(h=>h.s>0);
  if(!hits.length){out.innerHTML='<p class="none">No match yet. Check the spelling or try a shorter name.</p>';return}
  const groups={};hits.forEach(h=>{(groups[h.e.key]=groups[h.e.key]||{name:h.e.show,s:0,items:[]});const g=groups[h.e.key];g.s=Math.max(g.s,h.s);g.items.push(h.e)});
  const list=Object.values(groups).sort((a,b)=>b.s-a.s||a.name.localeCompare(b.name));
  const total=hits.length;const c=document.createElement('p');c.className='count';c.style.margin='0';
  c.textContent=`${total} ${total===1?'image':'images'} found`;out.appendChild(c);
  list.forEach(g=>{const sec=document.createElement('div');sec.className='group';
    const h=document.createElement('h3');h.textContent=g.name;const n=document.createElement('span');n.textContent=`${g.items.length} ${g.items.length===1?'image':'images'}`;h.appendChild(n);sec.appendChild(h);
    const t=document.createElement('div');t.className='tiles';g.items.forEach(e=>t.appendChild(tile(e)));sec.appendChild(t);out.appendChild(sec)})}
let timer;document.getElementById('q').addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(run,120)});

CHAPTERS.forEach(c=>{const d=document.createElement('article');d.className='chap';
  d.innerHTML=`<div class="pic"><img alt="" loading="lazy"></div><h2></h2><div class="meta"></div><div class="links"><a class="btn primary">Practice online</a><a class="btn" target="_blank" rel="noopener">Printable cards (PDF)</a></div>`;
  d.querySelector('img').src=c.thumb;d.querySelector('h2').textContent=c.title;
  d.querySelector('.meta').textContent=`${c.cards} cards · ${c.structures} structures`;
  const l=d.querySelectorAll('a');l[0].href=c.id+'.html';l[1].href=c.pdf;ch.appendChild(d)});
COMING.forEach(([t,m])=>{const d=document.createElement('article');d.className='chap';
  d.innerHTML=`<div class="soon"></div><h2></h2>`;d.querySelector('.soon').textContent=m;d.querySelector('h2').textContent=t;ch.appendChild(d)});
// open with a sample search so the page shows what it does
const hq=/^#q-([a-z0-9-]+)$/.exec(location.hash);document.getElementById('q').value=hq?hq[1].replace(/-/g,' '):'Superior vena cava';run();
</script>

</body>
